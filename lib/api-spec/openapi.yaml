openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: AI Character Studio API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: conversations
    description: Conversation management
  - name: messages
    description: Message operations
  - name: history
    description: History management
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /conversations:
    get:
      operationId: listConversations
      tags: [conversations]
      summary: List all conversations for authenticated user
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conversation"
    post:
      operationId: createConversation
      tags: [conversations]
      summary: Create a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationInput"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"

  /conversations/{id}:
    get:
      operationId: getConversation
      tags: [conversations]
      summary: Get a single conversation with messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationDetail"
        "404":
          description: Not found
    delete:
      operationId: deleteConversation
      tags: [conversations]
      summary: Delete a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /conversations/{id}/messages:
    post:
      operationId: sendMessage
      tags: [messages]
      summary: Send a message to AI in a conversation (streaming SSE)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "200":
          description: Streaming SSE response
          content:
            text/event-stream:
              schema:
                type: string

  /conversations/{id}/messages/list:
    get:
      operationId: listMessages
      tags: [messages]
      summary: List all messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"

  /history/recent:
    get:
      operationId: getRecentHistory
      tags: [history]
      summary: Get recent conversation summaries grouped by character
      responses:
        "200":
          description: Recent history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HistoryItem"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    Conversation:
      type: object
      required: [id, userId, characterId, characterName, animeSeries, mode, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: string
        characterId:
          type: string
        characterName:
          type: string
        animeSeries:
          type: string
        mode:
          type: string
        title:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: ["string", "null"]

    ConversationDetail:
      type: object
      required: [id, userId, characterId, characterName, animeSeries, mode, createdAt, messages]
      properties:
        id:
          type: integer
        userId:
          type: string
        characterId:
          type: string
        characterName:
          type: string
        animeSeries:
          type: string
        mode:
          type: string
        title:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: ["string", "null"]
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"

    ConversationInput:
      type: object
      required: [characterId, characterName, animeSeries, mode]
      properties:
        characterId:
          type: string
        characterName:
          type: string
        animeSeries:
          type: string
        mode:
          type: string
        title:
          type: string

    Message:
      type: object
      required: [id, conversationId, role, content, createdAt]
      properties:
        id:
          type: integer
        conversationId:
          type: integer
        role:
          type: string
        content:
          type: string
        imageUrl:
          type: ["string", "null"]
        liveSearch:
          type: boolean
          description: Enable Google live search grounding for this message.
        createdAt:
          type: string

    MessageInput:
      type: object
      required: [content, characterId, characterName, animeSeries, mode]
      properties:
        content:
          type: string
        characterId:
          type: string
        characterName:
          type: string
        animeSeries:
          type: string
        mode:
          type: string
        imageUrl:
          type: ["string", "null"]

    HistoryItem:
      type: object
      required: [conversationId, characterId, characterName, animeSeries, mode, lastMessage, createdAt]
      properties:
        conversationId:
          type: integer
        characterId:
          type: string
        characterName:
          type: string
        animeSeries:
          type: string
        mode:
          type: string
        lastMessage:
          type: string
        createdAt:
          type: string
